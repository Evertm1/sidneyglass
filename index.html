<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidney Glass Studio</title>
  <link rel="icon" type="image/png" href="photos/sidneyglass-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Hero: full-screen background image with the studio name and gallery entry -->
  <header class="hero">
    <div class="hero__scrim"></div>
    <div class="hero__inner">
      <p class="hero__eyebrow">Stained glass &middot; Seattle</p>
      <h1 class="hero__title">Sidney Glass Studio</h1>
      <div class="hero__actions">
        <button class="btn" id="viewGalleryBtn" aria-controls="gallery" aria-expanded="false">
          View gallery
        </button>
        <button class="btn" id="contactBtn" aria-controls="contact" aria-expanded="false">
          Contact
        </button>
        <button class="btn" id="shopBtn" aria-controls="shop" aria-expanded="false">
          Shop
        </button>
      </div>
      <div class="contact" id="contact" aria-hidden="true" hidden>
        <p class="contact__eyebrow">Get in touch</p>
        <p class="contact__text">Reach out to Dana Sidney for inquiries and commissions.</p>
        <a class="contact__email" href="mailto:danaesidney@gmail.com">danaesidney@gmail.com</a>
      </div>
      <div class="contact" id="shop" aria-hidden="true" hidden>
        <p class="contact__text">Coming soon&hellip;</p>
      </div>
    </div>
  </header>

  <!-- Gallery: hidden until "View gallery" is pressed, then panels illuminate in sequence -->
  <main>
    <section class="gallery" id="gallery" aria-hidden="true" hidden>
      <div class="gallery__head">
        <p class="gallery__eyebrow">Gallery</p>
        <h2 class="gallery__title">Selected work</h2>
      </div>
      <div class="grid">
        <button class="panel" type="button" data-src="photos/1.png" aria-label="Open piece 1">
          <img src="photos/1.png" alt="Stained glass piece 1" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/2.png" aria-label="Open piece 2">
          <img src="photos/2.png" alt="Stained glass piece 2" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/3.png" aria-label="Open piece 3">
          <img src="photos/3.png" alt="Stained glass piece 3" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/4.png" aria-label="Open piece 4">
          <img src="photos/4.png" alt="Stained glass piece 4" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/5.png" aria-label="Open piece 5">
          <img src="photos/5.png" alt="Stained glass piece 5" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/6.png" aria-label="Open piece 6">
          <img src="photos/6.png" alt="Stained glass piece 6" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/7.png" aria-label="Open piece 7">
          <img src="photos/7.png" alt="Stained glass piece 7" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/8.png" aria-label="Open piece 8">
          <img src="photos/8.png" alt="Stained glass piece 8" loading="lazy" />
        </button>
        <button class="panel" type="button" data-src="photos/9.png" aria-label="Open piece 9">
          <img src="photos/9.png" alt="Stained glass piece 9" loading="lazy" />
        </button>
      </div>
    </section>
  </main>

  <!-- Lightbox: click a panel to enlarge -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close image">&times;</button>
    <img class="lightbox__img" id="lightboxImg" src="" alt="" />
  </div>

  <script>
    (function () {
      var btn = document.getElementById("viewGalleryBtn");
      var gallery = document.getElementById("gallery");

      // Expandable panels below the buttons (Contact, Shop).
      // Defined up top so every button handler can collapse them.
      var panels = [
        { btn: document.getElementById("contactBtn"), panel: document.getElementById("contact") },
        { btn: document.getElementById("shopBtn"), panel: document.getElementById("shop") }
      ];

      function closePanel(item) {
        item.panel.classList.remove("is-revealed");
        item.panel.setAttribute("aria-hidden", "true");
        item.btn.setAttribute("aria-expanded", "false");
        setTimeout(function () {
          if (!item.panel.classList.contains("is-revealed")) item.panel.hidden = true;
        }, 200);
      }

      function openPanel(item) {
        item.panel.hidden = false;
        item.panel.setAttribute("aria-hidden", "false");
        item.btn.setAttribute("aria-expanded", "true");
        void item.panel.offsetHeight;
        item.panel.classList.add("is-revealed");
      }

      function closeAllPanels(except) {
        panels.forEach(function (item) {
          if (item !== except && item.panel.classList.contains("is-revealed")) {
            closePanel(item);
          }
        });
      }

      btn.addEventListener("click", function () {
        // Any expanded panel collapses when the gallery opens.
        closeAllPanels(null);
        // Reveal the gallery, then flip on the class that runs the staggered glow-in.
        gallery.hidden = false;
        gallery.setAttribute("aria-hidden", "false");
        btn.setAttribute("aria-expanded", "true");
        // Force a reflow so the transition fires on the freshly-shown element.
        void gallery.offsetHeight;
        gallery.classList.add("is-revealed");
        gallery.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      panels.forEach(function (item) {
        item.btn.addEventListener("click", function () {
          var isOpen = item.panel.classList.contains("is-revealed");
          // Collapse every other panel first.
          closeAllPanels(item);
          // Then toggle the one that was clicked.
          if (isOpen) {
            closePanel(item);
          } else {
            openPanel(item);
          }
        });
      });

      // Lightbox
      var lightbox = document.getElementById("lightbox");
      var lightboxImg = document.getElementById("lightboxImg");
      var lightboxClose = document.getElementById("lightboxClose");
      var lastFocused = null;

      function openLightbox(src, alt) {
        lastFocused = document.activeElement;
        lightboxImg.src = src;
        lightboxImg.alt = alt || "";
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        lightboxClose.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImg.src = "";
        if (lastFocused) lastFocused.focus();
      }

      document.querySelectorAll(".panel").forEach(function (panel) {
        panel.addEventListener("click", function () {
          var img = panel.querySelector("img");
          openLightbox(panel.getAttribute("data-src"), img ? img.alt : "");
        });
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
      });
    })();
  </script>
</body>
</html>
